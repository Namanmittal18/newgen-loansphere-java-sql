# ============================================================================
# LoanSphere - Application Configuration
# Newgen Java & SQL Campus Pre-Onboarding Assignment
# ============================================================================

server.port=8080
spring.application.name=LoanSphere

# ----------------------------------------------------------------------------
# Database Configuration (MySQL 8.x default, override via ENV variables)
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/newgen_loan_origination?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=LoanSphereHikariPool
spring.datasource.hikari.connection-timeout=20000

# ----------------------------------------------------------------------------
# Business Date Configuration (Format: yyyy-MM-dd; leave blank for current date)
# ----------------------------------------------------------------------------
loansphere.business.date=${BUSINESS_DATE:}

# ----------------------------------------------------------------------------
# Product Limits & Interest Rates (Configurable Parameters)
# ----------------------------------------------------------------------------
# PERSONAL LOAN
loansphere.product.personal.min-amount=50000.00
loansphere.product.personal.max-amount=500000.00
loansphere.product.personal.min-tenure=12
loansphere.product.personal.max-tenure=60
loansphere.product.personal.min-income=20000.00
loansphere.product.personal.annual-interest-rate=12.00

# EDUCATION LOAN
loansphere.product.education.min-amount=100000.00
loansphere.product.education.max-amount=1000000.00
loansphere.product.education.min-tenure=12
loansphere.product.education.max-tenure=84
loansphere.product.education.min-income=15000.00
loansphere.product.education.annual-interest-rate=10.00

# ----------------------------------------------------------------------------
# Background Schedulers Configuration
# ----------------------------------------------------------------------------
loansphere.scheduler.enabled=true
# Overdue review checks run daily at midnight by default
loansphere.scheduler.overdue.cron=0 0 0 * * ?
# CoreDataPush runs periodically to sync DISBURSED loans to NG_CORE_BANKING
loansphere.scheduler.corepush.fixed-delay-ms=5000
loansphere.export.csv.directory=${CSV_EXPORT_DIR:exports}

# ----------------------------------------------------------------------------
# Thymeleaf & Static Resources
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.newgen.loanorigination=DEBUG
logging.level.org.springframework.jdbc=INFO
